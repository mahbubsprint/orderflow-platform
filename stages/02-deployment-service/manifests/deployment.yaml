apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
spec:
  replicas: 3
  # "Pods with label app=orders are mine". Must match the template labels below.
  selector:
    matchLabels:
      app: orders
  # Pod blueprint: same as Stage 1's pod.yaml spec
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: orders:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
