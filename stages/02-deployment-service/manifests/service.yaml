apiVersion: v1
kind: Service
metadata:
  name: orders
  labels:
    app: orders
spec:
  # ClusterIP = reachable only inside the cluster
  type: ClusterIP
  # Send traffic to Pods with this label (stamped by the Deployment)
  selector:
    app: orders
  ports:
    - name: http
      port: 80          # port clients call: http://orders
      targetPort: 3000  # port the app listens on inside the Pod
      protocol: TCP
